# =============================================================================
# Gradle build tuning — host: Acer Nitro AN515-52 (i5-8300H, 8 threads, 14 GiB RAM)
# Goal: fastest builds that STAY STABLE on limited RAM (swap fills fast here) and
# while an emulator + Android Studio are also running.
#
# Mirrors the tuning proven on the Forge project on this same laptop. Nothing
# machine-specific (absolute paths, JDK homes) belongs in this file — those live
# in each machine's own ~/.gradle/gradle.properties, which is untracked.
# =============================================================================

# --- JVM / memory -----------------------------------------------------------
# 1600m heap, not the 3g Forge uses. Forge's 3g assumes ONE Android Studio plus an
# emulator; this laptop is regularly running TWO Studio instances (~7.8 GiB between
# them, leaving ~3 GiB with swap already full), and at 3g the kernel OOM-killer takes
# the Gradle daemon out mid-dex:
#
#   oom-kill: ... task=java,pid=348851        <- the Gradle daemon
#   Out of memory: Killed process 348851 (java) total-vm:9300516kB anon-rss:3168912kB
#
# which Gradle reports only as the misleading "Gradle build daemon disappeared
# unexpectedly" — no hint that the box ran out of RAM. :app is a single module, so
# 1600m is ample; headroom matters more than heap size here, and these are the exact
# numbers a full assembleDebug (KSP + Hilt aggregation + dexing) was verified on.
# With only one Studio open there is room to go back to Forge's -Xmx3g / 1536m / 6
# workers for a faster build. G1 keeps GC pauses short.
org.gradle.jvmargs=-Xmx1600m -Xms384m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# If a build still gets OOM-killed, close one Studio, or shrink a single run without
# editing this file:
#   ./gradlew :app:assembleDebug --max-workers=2 \
#     -Dorg.gradle.jvmargs="-Xmx1200m -Xms256m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC" \
#     -Pkotlin.daemon.jvmargs="-Xmx768m -XX:+UseG1GC"
# Distinguish an OOM kill from a JVM crash (the R8/D8 SIGSEGV that forces the JBR
# requirement above looks similar from Gradle's side) with:
#   journalctl -k --since "10 min ago" | grep -i oom

# Gradle must run on Android Studio's bundled JetBrains Runtime (JBR), NOT the distro
# OpenJDK: distro OpenJDK 21 on Ubuntu SIGSEGVs inside R8/D8 during dexing (JIT
# miscompilation, not OOM). JBR is the AGP-recommended runtime and is stable.
#
# The JBR path is machine-specific, so it is intentionally NOT committed here — a hard-
# coded path breaks every other machine on pull. Each machine sets its own path in
# ~/.gradle/gradle.properties (user-global, untracked), e.g.:
#   org.gradle.java.home=/home/yash/software/android-studio-otter/jbr
# Find yours with: find ~ /opt -maxdepth 5 -type d -name jbr 2>/dev/null

# --- Parallelism / daemon ---------------------------------------------------
org.gradle.daemon=true
org.gradle.parallel=true
# 2 of 8 threads. Forge uses 6; this drops to 2 because each worker is another slice
# of RAM on a box that is already swapping with two Studios open. Costs little on a
# single-module project, where there is barely any cross-task parallelism to exploit.
org.gradle.workers.max=2
# Release the idle daemon's RAM after 30 min so it stops starving the emulator.
org.gradle.daemon.idletimeout=1800000

# --- Caching: the big speedups ----------------------------------------------
# Reuse task outputs across builds and projects.
org.gradle.caching=true
# Skip configuration entirely when nothing relevant changed — the single biggest
# modern win. 'warn' lets a not-yet-compatible plugin degrade gracefully instead
# of failing the build.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
# Watch the filesystem so up-to-date checks are near-instant.
org.gradle.vfs.watch=true

# --- Android ----------------------------------------------------------------
android.useAndroidX=true
android.enableJetifier=false
# Non-transitive R classes = smaller, faster R-class compilation.
android.nonTransitiveRClass=true
android.enableR8.fullMode=true

# --- Kotlin -----------------------------------------------------------------
kotlin.code.style=official
kotlin.incremental=true
# Cap the Kotlin compile daemon so it fits the RAM budget alongside everything else.
# 900m rather than Forge's 1536m, for the same headroom reason as the Gradle heap.
kotlin.daemon.jvmargs=-Xmx900m -XX:+UseG1GC

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
